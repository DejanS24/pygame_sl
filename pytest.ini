[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categories
markers =
    unit: Unit tests for individual components
    integration: Integration tests for end-to-end workflows

# Coverage options
addopts =
    --cov=lang
    --cov=generator
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=70
    -v
